name: Release

# Builds the fagus binary for every platform and puts the binaries, with their SHA-256 sums and a
# CycloneDX SBOM of each, into a draft release. Every binary gets an attestation of the build
# that made it (SLSA provenance, signed through Sigstore with the workflow's identity, no key) and
# one of its SBOM; `gh attestation verify` checks them (SECURITY.md). docs/releasing.md describes
# the steps around it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, as in Cargo.toml (0.1.0)
        required: true

permissions:
  contents: write
  # Attestations: the OIDC token that Sigstore signs with, and writing them to the repository.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are linked with zig: against glibc 2.17, so that they run on every
          # maintained distribution, and statically against musl for Alpine.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: x86_64-unknown-linux-gnu.2.17 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: aarch64-unknown-linux-gnu.2.17 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: x86_64-unknown-linux-musl }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: aarch64-unknown-linux-musl }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # FreeBSD has no runner: the binary is built natively in a FreeBSD VM on Linux, on the
          # oldest major release FreeBSD supports, and renders a document there; the job
          # `freebsd-15` runs it on the newest one.
          - { target: x86_64-unknown-freebsd, os: ubuntu-latest, freebsd: '14' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        shell: bash
        run: |
          grep -q "^version = \"$VERSION\"$" Cargo.toml || { echo "Cargo.toml is not at version $VERSION"; exit 1; }
      # With the components of rust-toolchain.toml, so that rustup does not add them during the
      # build (which fails on some runner images).
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Build with zig
        if: matrix.zig
        run: |
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild@0.23.4
          cargo zigbuild --release --locked -p fagus-cli --target ${{ matrix.zig }}
      - name: Build
        if: ${{ !matrix.zig && !matrix.freebsd }}
        run: cargo build --release --locked -p fagus-cli --target ${{ matrix.target }}
      # Built, collected and run in the VM; the files of dist/ come back to the runner, which makes
      # the SBOM and the attestations as for the other targets. The rest of target/ stays there.
      - name: Build and run in FreeBSD
        if: matrix.freebsd
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: ${{ matrix.freebsd }}
          prepare: |
            set -e
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain none
          run: |
            set -e
            . "$HOME/.cargo/env"
            freebsd-version
            cargo build --release --locked -p fagus-cli --target ${{ matrix.target }}
            mkdir dist
            cp "target/${{ matrix.target }}/release/fagus" "dist/fagus-${{ matrix.target }}"
            rm -rf target
            echo '<h1>Fagus</h1>' > probe.html
            "dist/fagus-${{ matrix.target }}" render probe.html -o probe.pdf
            test "$(head -c 5 probe.pdf)" = "%PDF-"
      - name: Collect
        if: ${{ !matrix.freebsd }}
        shell: bash
        run: |
          mkdir dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/fagus.exe" "dist/fagus-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/fagus" "dist/fagus-${{ matrix.target }}"
          fi
      # The binaries that the runner can run render a document (FreeBSD's in its VM).
      - name: Run
        if: ${{ !contains(matrix.target, 'aarch64-unknown-linux') && matrix.target != 'x86_64-apple-darwin' && !matrix.freebsd }}
        shell: bash
        run: |
          binary=$(ls dist/fagus-*)
          chmod +x "$binary"
          echo '<h1>Fagus</h1>' > probe.html
          "$binary" render probe.html -o probe.pdf
          test "$(head -c 5 probe.pdf)" = "%PDF-"
      # The crates the binary is built from, for this target, with their versions and licenses.
      - name: SBOM
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx@0.5.10
          cargo cyclonedx --manifest-path crates/fagus-cli/Cargo.toml --format json --all \
            --target "${{ matrix.target }}" --spec-version 1.5 \
            --override-filename "fagus-${{ matrix.target }}.cdx"
          mv "crates/fagus-cli/fagus-${{ matrix.target }}.cdx.json" dist/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/fagus-${{ matrix.target }}*
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: dist/fagus-${{ matrix.target }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          sbom-path: dist/fagus-${{ matrix.target }}.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fagus-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The experimental C library (crates/fagus-ffi, docs/ffi.md, ADR 8): per platform an archive
  # with the shared library, fagus.h and the licenses, with an SBOM and attestations as the
  # binaries. Not for musl, whose static targets build no shared library.
  library:
    name: library ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: x86_64-unknown-linux-gnu.2.17, files: libfagus_ffi.so }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: aarch64-unknown-linux-gnu.2.17, files: libfagus_ffi.so }
          - { target: x86_64-apple-darwin, os: macos-latest, files: libfagus_ffi.dylib }
          - { target: aarch64-apple-darwin, os: macos-latest, files: libfagus_ffi.dylib }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, files: fagus_ffi.dll fagus_ffi.dll.lib }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NAME: fagus-ffi-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        run: |
          grep -q "^version = \"$VERSION\"$" Cargo.toml || { echo "Cargo.toml is not at version $VERSION"; exit 1; }
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Build with zig
        if: matrix.zig
        run: |
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild@0.23.4
          cargo zigbuild --release --locked -p fagus-ffi --target ${{ matrix.zig }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p fagus-ffi --target ${{ matrix.target }}
      - name: Pack
        run: |
          mkdir -p "dist" "$NAME"
          for file in ${{ matrix.files }}; do cp "target/${{ matrix.target }}/release/$file" "$NAME/"; done
          cp crates/fagus-ffi/include/fagus.h LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES "$NAME/"
          tar -czf "dist/$NAME.tar.gz" "$NAME"
      # A C program built against the header renders a document, where the runner can run it.
      - name: Run
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        run: |
          cc -o render crates/fagus-ffi/tests/render.c -I "$NAME" -L "$NAME" -lfagus_ffi "-Wl,-rpath,$PWD/$NAME"
          ./render probe.pdf
          test "$(head -c 5 probe.pdf)" = "%PDF-"
      - name: SBOM
        run: |
          cargo install --locked cargo-cyclonedx@0.5.10
          cargo cyclonedx --manifest-path crates/fagus-ffi/Cargo.toml --format json --all \
            --target "${{ matrix.target }}" --spec-version 1.5 --override-filename "$NAME.cdx"
          mv "crates/fagus-ffi/$NAME.cdx.json" dist/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/${{ env.NAME }}*
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: dist/${{ env.NAME }}.tar.gz
          sbom-path: dist/${{ env.NAME }}.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  # The FreeBSD binary is built on FreeBSD 14 and must run on the newest major release too: it
  # renders a document on FreeBSD 15 before the release is drafted. The job only reads: the VM's
  # action gets no token that writes or signs.
  freebsd-15:
    name: x86_64-unknown-freebsd on FreeBSD 15
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fagus-x86_64-unknown-freebsd
          path: dist
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '15'
          copyback: false
          run: |
            set -e
            freebsd-version
            chmod +x dist/fagus-x86_64-unknown-freebsd
            echo '<h1>Fagus</h1>' > probe.html
            dist/fagus-x86_64-unknown-freebsd render probe.html -o probe.pdf
            test "$(head -c 5 probe.pdf)" = "%PDF-"

  release:
    name: Draft release
    needs: [build, library, freebsd-15]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: fagus-*
          merge-multiple: true
      - name: Sum
        working-directory: dist
        run: sha256sum fagus-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/SHA256SUMS
      # The licenses of the code and data of others in the binaries (tools/notices.sh).
      - name: Notices
        run: cp source/THIRD-PARTY-NOTICES dist/
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Fagus $VERSION" \
            --notes "Binaries built from $GITHUB_SHA, with a CycloneDX SBOM each (fagus-<target>.cdx.json); the experimental C library in fagus-ffi-<target>.tar.gz (docs/ffi.md). Check one with \`gh attestation verify fagus-<target> --repo $GITHUB_REPOSITORY\`. Pin them with tools/pin-binaries.php before publishing (docs/releasing.md)."
