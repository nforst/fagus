name: Release

# Builds the fagus binary for every platform and puts the binaries, with their SHA-256 sums and a
# CycloneDX SBOM of each, into a draft release. Every binary gets an attestation of the build
# that made it (SLSA provenance, signed through Sigstore with the workflow's identity, no key) and
# one of its SBOM; `gh attestation verify` checks them (SECURITY.md). docs/releasing.md describes
# the steps around it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, as in Cargo.toml (0.1.0)
        required: true

permissions:
  contents: write
  # Attestations: the OIDC token that Sigstore signs with, and writing them to the repository.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are linked with zig: against glibc 2.17, so that they run on every
          # maintained distribution, and statically against musl for Alpine.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: x86_64-unknown-linux-gnu.2.17 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: aarch64-unknown-linux-gnu.2.17 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: x86_64-unknown-linux-musl }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: aarch64-unknown-linux-musl }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # FreeBSD has no runner: the binary is built natively in a FreeBSD VM on Linux, on the
          # oldest major release FreeBSD supports, and renders a document there.
          - { target: x86_64-unknown-freebsd, os: ubuntu-latest, freebsd: '14' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        shell: bash
        run: |
          grep -q "^version = \"$VERSION\"$" Cargo.toml || { echo "Cargo.toml is not at version $VERSION"; exit 1; }
      # With the components of rust-toolchain.toml, so that rustup does not add them during the
      # build (which fails on some runner images).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Build with zig
        if: matrix.zig
        run: |
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild@0.23.4
          cargo zigbuild --release --locked -p fagus-cli --target ${{ matrix.zig }}
      - name: Build
        if: ${{ !matrix.zig && !matrix.freebsd }}
        run: cargo build --release --locked -p fagus-cli --target ${{ matrix.target }}
      # Built, collected and run in the VM; the files of dist/ come back to the runner, which makes
      # the SBOM and the attestations as for the other targets. The rest of target/ stays there.
      - name: Build and run in FreeBSD
        if: matrix.freebsd
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.freebsd }}
          prepare: |
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain none
          run: |
            . "$HOME/.cargo/env"
            freebsd-version
            cargo build --release --locked -p fagus-cli --target ${{ matrix.target }}
            mkdir dist
            cp "target/${{ matrix.target }}/release/fagus" "dist/fagus-${{ matrix.target }}"
            rm -rf target
            echo '<h1>Fagus</h1>' > probe.html
            "dist/fagus-${{ matrix.target }}" render probe.html -o probe.pdf
            test "$(head -c 5 probe.pdf)" = "%PDF-"
      - name: Collect
        if: ${{ !matrix.freebsd }}
        shell: bash
        run: |
          mkdir dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/fagus.exe" "dist/fagus-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/fagus" "dist/fagus-${{ matrix.target }}"
          fi
      # The binaries that the runner can run render a document (FreeBSD's in its VM).
      - name: Run
        if: ${{ !contains(matrix.target, 'aarch64-unknown-linux') && matrix.target != 'x86_64-apple-darwin' && !matrix.freebsd }}
        shell: bash
        run: |
          binary=$(ls dist/fagus-*)
          chmod +x "$binary"
          echo '<h1>Fagus</h1>' > probe.html
          "$binary" render probe.html -o probe.pdf
          test "$(head -c 5 probe.pdf)" = "%PDF-"
      # The crates the binary is built from, for this target, with their versions and licenses.
      - name: SBOM
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx@0.5.10
          cargo cyclonedx --manifest-path crates/fagus-cli/Cargo.toml --format json --all \
            --target "${{ matrix.target }}" --spec-version 1.5 \
            --override-filename "fagus-${{ matrix.target }}.cdx"
          mv "crates/fagus-cli/fagus-${{ matrix.target }}.cdx.json" dist/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/fagus-${{ matrix.target }}*
      - uses: actions/attest-sbom@v2
        with:
          subject-path: dist/fagus-${{ matrix.target }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          sbom-path: dist/fagus-${{ matrix.target }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: fagus-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fagus-*
          merge-multiple: true
      - name: Sum
        working-directory: dist
        run: sha256sum fagus-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      # The licenses of the code and data of others in the binaries (tools/notices.sh).
      - name: Notices
        run: cp source/THIRD-PARTY-NOTICES dist/
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Fagus $VERSION" \
            --notes "Binaries built from $GITHUB_SHA, with a CycloneDX SBOM each (fagus-<target>.cdx.json). Check one with \`gh attestation verify fagus-<target> --repo $GITHUB_REPOSITORY\`. Pin them with tools/pin-binaries.php before publishing (docs/releasing.md)."
