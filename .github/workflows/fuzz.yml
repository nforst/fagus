name: Fuzz

# Fuzzes every target of fuzz/ (cargo-fuzz, libFuzzer) for a while each night. The corpus of each
# target is kept in the cache from one night to the next; crashes are uploaded as artifacts and
# fail the job. Besides this workflow, only the `fuzz` job of ci.yml (which checks that the
# targets build) uses a nightly toolchain.

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: '600'
      sanitizer:
        description: Sanitizer (address checks the unsafe code in dependencies, but is slower)
        type: choice
        options: [none, address]
        default: none

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FUZZ_SANITIZER: ${{ inputs.sanitizer || 'none' }}

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [render, css, font, image, avif, pdf, svg, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        run: fuzz/run.sh ${{ matrix.target }} ${{ inputs.seconds || '600' }}
      # Keeps the inputs that add coverage; the corpus would otherwise grow every night.
      - name: Minimize the corpus
        if: success()
        run: |
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          cargo +nightly fuzz cmin --target "$host" --sanitizer "$FUZZ_SANITIZER" ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -timeout=60 -rss_limit_mb=4096
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 7
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
