name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # The oldest Rust that `rust-version` in Cargo.toml promises: the workspace builds and its
  # tests pass with exactly that release, not only with the one rust-toolchain.toml pins for
  # development (`cargo +<version>` overrides it).
  msrv:
    name: Rust 1.97.0 (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: rust-version is the version tested here
        run: grep -qx 'rust-version = "1.97"' Cargo.toml
      - run: cargo +1.97.0 build --workspace --all-targets --locked
      - run: cargo +1.97.0 test --workspace --locked

  # The sandbox of the binary on Linux (crates/fagus-cli/src/sandbox.rs, docs/cli.md#sandbox): a
  # sandboxed thread cannot open sockets, start programs or read and write files outside its
  # directories, and renders the corpus to the same bytes as outside; the binary limits what a
  # worker reads with --allow-read. FAGUS_REQUIRE_LANDLOCK fails the tests where the kernel of the
  # runner lacks Landlock instead of skipping them. tools/determinism.sh (gates.yml) renders the
  # whole corpus with the sandbox on.
  sandbox:
    name: sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      FAGUS_REQUIRE_LANDLOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fagus-cli
      - name: The binary says it is sandboxed
        run: |
          cargo build -p fagus-cli
          echo '<p>Sandbox</p>' > probe.html
          FAGUS_LOG=debug target/debug/fagus render probe.html -o probe.pdf 2> log.txt
          cat log.txt
          grep -Eq "Landlock: (Fully|Partially)Enforced" log.txt
          grep -q "seccomp: enforced" log.txt

  # FreeBSD, which release.yml builds a binary for and GitHub has no runner for: the tests pass in
  # a FreeBSD VM on Linux, the binary renders outside a sandbox (there is none on FreeBSD), and
  # with system fonts it finds the fonts that fontconfig's configuration in /usr/local/etc/fonts
  # lists (crates/fagus-text/src/system.rs): DejaVu, moved where only local.conf names it, gives
  # the Hebrew letters that the built-in Inter lacks. gates.yml renders the corpus there.
  freebsd:
    name: FreeBSD 14 (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          envs: 'CARGO_TERM_COLOR RUSTFLAGS'
          copyback: false
          prepare: |
            set -e
            pkg install -y dejavu
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain none
          run: |
            set -e
            . "$HOME/.cargo/env"
            freebsd-version
            cargo test --workspace --locked
            cargo build --locked -p fagus-cli
            echo '<p>FreeBSD</p>' > probe.html
            FAGUS_LOG=debug target/debug/fagus render probe.html -o probe.pdf 2> log.txt
            cat log.txt
            grep -q "no sandbox on this system" log.txt
            test "$(head -c 5 probe.pdf)" = "%PDF-"
            mkdir -p /usr/local/etc/fonts /opt/fagus-fonts
            mv "$(dirname "$(find /usr/local/share/fonts -name DejaVuSans.ttf)")" /opt/fagus-fonts/
            printf '<fontconfig><dir>/opt/fagus-fonts</dir></fontconfig>\n' > /usr/local/etc/fonts/local.conf
            echo '<p lang="he">&#x05E9;&#x05DC;&#x05D5;&#x05DD;</p>' > hebrew.html
            if target/debug/fagus render hebrew.html -o hebrew.pdf --strict; then exit 1; fi
            target/debug/fagus render hebrew.html -o hebrew.pdf --strict --system-fonts

  # The fuzz targets (fuzz/, a workspace of its own on nightly) still build: the worker target
  # includes the protocol code of fagus-cli, and fuzz.yml runs only at night.
  fuzz:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo +nightly check --locked --bins
        working-directory: fuzz

  # The experimental C library (crates/fagus-ffi, docs/ffi.md) called from PHP through FFI. Its
  # Rust tests, which also build a C program against its header, run in `check`.
  ffi:
    name: C library from PHP
    runs-on: ubuntu-latest
    env:
      FAGUS_REQUIRE_FFI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p fagus-ffi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: ffi
      - run: php tools/ffi.php

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The toolchain of rust-toolchain.toml, which the action's container does not have.
          rust-version: "1.99.1"

  # docs/nav.yml lists every page of the documentation for fagus.niklasforst.de, and the links
  # between the pages lead to pages and headings that exist.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: php tools/check-docs.php

  # The packages start the binary, talk to it through pipes and install it on every platform the
  # release builds for.
  php:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '8.3' }
          - { os: ubuntu-latest, php: '8.5' }
          - { os: macos-latest, php: '8.5' }
          - { os: windows-latest, php: '8.5' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p fagus-cli
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          # league/flysystem-local (through Laravel) needs it; Windows builds lack it.
          extensions: fileinfo
      - name: nforst/fagus
        run: |
          composer install --no-interaction --no-progress
          php vendor/bin/phpunit
      # The code style of pint.json, checked once: the result is the same on every runner.
      - name: Code style (Pint)
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.5'
        run: php vendor/bin/pint --test
