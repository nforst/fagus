name: Release gates

# The checks a release relies on (docs/releasing.md): the corpus validates as PDF/A, PDF/UA and
# Factur-X, renders to the same bytes every time and on every platform, looks like Chrome's print,
# and the benchmark invoices render without gross slowdowns.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With the components of rust-toolchain.toml, so that rustup does not add them during the
      # build.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p fagus-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fagus-${{ matrix.name }}
          path: target/release/fagus
          if-no-files-found: error
          retention-days: 7
      # The harness of the comparison with Chrome, from the crates just built.
      - if: matrix.name == 'linux-x64'
        run: cargo build --release --locked -p fagus-testkit
      - if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fagus-conformance-linux-x64
          path: target/release/fagus-conformance
          if-no-files-found: error
          retention-days: 7

  # tools/validate.sh: veraPDF for every PDF/A level and PDF/UA-1, qpdf --check for every file,
  # Mustang for the Factur-X invoices. The tools are pinned and checked in the script.
  validate:
    name: PDF/A, PDF/UA, Factur-X
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FAGUS: ${{ github.workspace }}/bin/fagus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fagus-linux-x64
          path: bin
      - run: chmod +x bin/fagus
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/validate-tools
          key: validate-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/validate.sh') }}
      - run: tools/validate.sh validation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: validation
          path: |
            validation/*.txt
            validation/pdf
          retention-days: 7

  # tools/determinism.sh: every page rendered twice gives the same bytes; the sums of the files go
  # to the job `same-bytes`, which compares the platforms.
  determinism:
    name: determinism (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FAGUS: ${{ github.workspace }}/bin/fagus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fagus-${{ matrix.name }}
          path: bin
      - run: chmod +x bin/fagus
      - run: tools/determinism.sh determinism
      # The files too, so that those that differ between platforms can be compared.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: determinism-${{ matrix.name }}
          path: |
            determinism/SHA256SUMS
            determinism/pdf
          retention-days: 7

  # The same for FreeBSD, which has no runner: built and run in a FreeBSD VM on Linux, as
  # release.yml builds its binary. The status of the script comes back with its files, so that
  # they are uploaded when it fails too.
  determinism-freebsd:
    name: determinism (freebsd-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '14'
          prepare: |
            set -e
            pkg install -y bash
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain none
          run: |
            set -e
            . "$HOME/.cargo/env"
            freebsd-version
            cargo build --release --locked -p fagus-cli
            status=0
            FAGUS="$PWD/target/release/fagus" JOBS=$(sysctl -n hw.ncpu) tools/determinism.sh determinism || status=$?
            echo "$status" > determinism/status
            rm -rf target
      - run: exit "$(cat determinism/status)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: determinism-freebsd-x64
          path: |
            determinism/SHA256SUMS
            determinism/pdf
          retention-days: 7

  same-bytes:
    name: same bytes on every platform
    needs: [determinism, determinism-freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: determinism-*
          path: determinism
      - name: Compare the sums with those of Linux x64
        run: |
          status=0
          reference=determinism/determinism-linux-x64/SHA256SUMS
          for sums in determinism/*/SHA256SUMS; do
            platform=$(basename "$(dirname "$sums")")
            platform=${platform#determinism-}
            # The files whose sum differs, or that only one platform has.
            different=$(diff <(sort -k2 "$reference") <(sort -k2 "$sums") | sed -n 's/^[<>] [0-9a-f]* *//p' | sort -u)
            if [ -n "$different" ]; then
              status=1
              echo "Different from Linux x64 on $platform:"
              echo "$different"
              {
                echo "### Different from Linux x64 on $platform"
                echo
                echo "$different" | awk '{ print "- " $0 }'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$platform: $(wc -l < "$sums") files, the same as on Linux x64"
            fi
          done
          exit $status

  # tools/chrome-corpus.sh: every page of the corpus printed by Chrome for Testing (the version
  # pinned in the script) and by Fagus, both drawn by pdftoppm; every document must match within
  # the tolerance, except those tools/chrome-expectations.txt lists. Chrome and Fagus see the
  # same fonts, which the script picks.
  chrome:
    name: corpus against Chrome
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FAGUS_CONFORMANCE: ${{ github.workspace }}/bin/fagus-conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fagus-conformance-linux-x64
          path: bin
      - run: chmod +x bin/fagus-conformance
      # pdftoppm, and the fonts tools/chrome-corpus.sh gives Chrome and Fagus.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-liberation2 \
            fonts-dejavu-core fonts-dejavu-extra fonts-noto-core fonts-noto-cjk
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('tools/chrome-corpus.sh') }}
      - run: tools/chrome-corpus.sh chrome-corpus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chrome-corpus
          path: |
            chrome-corpus/results.txt
            chrome-corpus/summary.md
            chrome-corpus/expectations.txt
            chrome-corpus/chrome
            chrome-corpus/fagus
          retention-days: 7

  # tools/bench-smoke.py: the benchmark invoices against three times the budgets, which only
  # catches gross regressions on a shared runner. The numbers go into the job summary.
  bench:
    name: benchmark smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FAGUS: ${{ github.workspace }}/bin/fagus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fagus-linux-x64
          path: bin
      - run: chmod +x bin/fagus
      - run: python3 tools/bench-smoke.py bench-smoke
      # What a worker keeps after large documents on Linux (glibc), as it reports it, with the
      # trim after each document and without (FAGUS_MALLOC_TRIM=0): a measurement for the job
      # summary, not a check.
      - run: python3 tools/worker-memory.py worker-memory
