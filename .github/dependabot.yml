# The actions of the workflows are pinned to commits, with their versions in comments; Dependabot
# proposes the commits of new versions, all of a week in one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
