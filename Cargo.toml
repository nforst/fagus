[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
# Used as a Git dependency (docs/rust.md), not from crates.io.
publish = false
authors = ["Niklas Forst"]
repository = "https://github.com/nforst/fagus"
homepage = "https://fagus.niklasforst.de"
description = "HTML and CSS to PDF, without a browser"

[workspace.dependencies]
fagus-dom = { path = "crates/fagus-dom" }
fagus-css = { path = "crates/fagus-css" }
fagus-style = { path = "crates/fagus-style" }
fagus-text = { path = "crates/fagus-text" }
fagus-layout = { path = "crates/fagus-layout" }
fagus-paint = { path = "crates/fagus-paint" }
# Their default feature `parallel` is chosen by the crates that use them.
fagus-pdf = { path = "crates/fagus-pdf", default-features = false }
fagus = { path = "crates/fagus", default-features = false }

html5ever = "0.40.1"
markup5ever = "0.40.0"
# Parses XHTML documents (.xhtml) as XML, as browsers do; same tree interface as html5ever.
xml5ever = "0.40.0"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["into_owned", "substitute_variables"] }
parcel_selectors = "0.28.3"
cssparser = "0.37.0"
skrifa = "0.49.0"
harfrust = "0.15.0"
unicode-linebreak = "0.1.5"
# Line breaks inside words of Thai, Lao, Khmer and Myanmar text, found with a dictionary as ICU finds
# them in Chrome (UAX #14 leaves them to "complex context" analysis).
icu_segmenter = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
# General categories, for the characters that take emphasis marks; rustybuzz already depends on it.
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji", "general-category"] }
# The bidirectional algorithm (UAX #9) for right-to-left and mixed text.
unicode-bidi = "0.3.18"
# Fagus shapes text itself, so krilla's own shaper (simple-text) is not needed.
# krilla's `rayon` (with fagus-pdf's feature `parallel`) compresses the content streams of pages
# side by side. Its `pdf` draws the pages of PDF files that documents show as images (letterheads
# as page templates), as Form XObjects.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "pdf"] }
# Reads the PDF files shown as images (their pages, sizes and content streams); krilla's `pdf`
# already depends on it.
hayro-syntax = { version = "0.7.2", default-features = false, features = ["std"] }
# Extracts the page of a PDF image as krilla does, to check before that every object it refers to
# exists (krilla cannot write a page that refers to missing objects); krilla's `pdf` already
# depends on both.
hayro-write = "0.7.0"
pdf-writer = "0.15.0"
rayon = "1.12.0"
imagesize = "0.14.0"
krilla-svg = "0.8.1"
usvg = "0.47.0"
# Draws the pixels of SVG images that filters change; krilla-svg already depends on it.
resvg = { version = "0.47.0", default-features = false }
# krilla compresses with flate2; the zlib-rs backend is several times faster than miniz_oxide.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
rustc-hash = "2.1.3"
# Trigonometry, powers, logarithms and exponentials with the same bits on every platform (the
# system's math library differs between glibc versions and macOS); rustybuzz already depends on
# it. clippy.toml refuses the methods of f32 and f64 that would call the system's.
libm = "0.2.16"
# Rasterizes the glyphs of blurred text shadows; krilla-svg already depends on it.
tiny-skia = "0.12.0"
# Decode the images that filters change; krilla already depends on them.
png = "0.18.1"
zune-jpeg = "0.5.15"
image-webp = "0.2.4"
gif = "0.14.2"
# TIFF images (beyond Chrome, as Safari shows them): scans and receipts, uncompressed, LZW, Deflate,
# PackBits, CCITT Group 4 and JPEG.
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "fax", "jpeg", "lzw"] }
# AVIF images: AV1 decoded by rav1d (the Rust port of dav1d) through the safe API of its fork
# re_rav1d, without the assembly, which would need nasm and a C compiler and gives the same pixels.
re_rav1d = { version = "0.1.3", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# Indexes the fonts installed on the system (opt-in); usvg already depends on it.
fontdb = { version = "0.23.0", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
# WOFF and WOFF2 fonts are unpacked to OpenType before use.
wuff = "0.2.9"
# Decompresses the embedded hyphenation dictionaries (wuff already uses it for WOFF2).
brotli-decompressor = { version = "5.0.3", default-features = false }
# Digital signatures (PAdES): CMS signed data with X.509 certificates, RSA and ECDSA P-256 keys,
# read from PKCS#12 files.
cms = "=0.3.0-rc.2"
x509-cert = { version = "=0.3.0", default-features = false, features = ["std", "pem"] }
der = { version = "=0.8.3", features = ["std", "derive", "oid"] }
rsa = { version = "=0.10.0", default-features = false, features = ["std", "encoding", "getrandom", "pkcs1v15"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p12-keystore = "=0.4.1"
smallvec = "1.16.4"
thiserror = "2.0.21"
# Password protection (AES-256, the standard security handler of PDF 2.0). Pinned exactly: the
# cryptography is updated on purpose, not along with other dependencies.
aes = "=0.9.4"
cbc = { version = "=0.2.1", features = ["alloc"] }
# The hashes of encryption keys and of signed data.
sha2 = "=0.11.1"
# The identifiers of certificates in OCSP requests, which every responder understands with SHA-1.
sha1 = "=0.11.0"
# The salts, keys and initialization vectors of encryption; ahash already depends on it.
getrandom = "0.3.4"
# SASLprep (RFC 4013) of passwords: the tables of stringprep (RFC 3454) and NFKC.
stringprep = "0.1.5"
unicode-normalization = "0.1.25"
clap = { version = "4.6.7", features = ["derive"] }
# The peak resident size of the worker on macOS and FreeBSD (getrusage), which it reports with
# every document.
nix = { version = "0.31.4", default-features = false, features = ["resource"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The sandbox of the command line tool on Linux: Landlock for files and network, a seccomp filter
# for system calls, resource limits; libc for the numbers of the system calls.
landlock = "0.4.7"
seccompiler = "0.5.0"
rlimit = "0.11.0"
libc = "0.2.191"

[workspace.lints.rust]
# Every library crate forbids unsafe code itself (`#![forbid(unsafe_code)]`); the command line
# allows it in one place, to call glibc's `malloc_trim` (crates/fagus-cli/src/memory.rs).
unsafe_code = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Value conversions map several CSS keywords to the same computed value on purpose.
match_same_arms = "allow"
trivially_copy_pass_by_ref = "allow"
unused_self = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
