# cargo-about configuration for THIRD-PARTY-NOTICES (tools/notices.sh): the licenses of the crates
# the fagus binary is built from.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
]
# The targets of the release (.github/workflows/release.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-freebsd",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# re_rav1d (AVIF images) has its license in COPYING; without it named, the headers of the dav1d C
# files the crate carries would each count as a license. The MIT notice of the dav1d-rs API it
# takes is added by tools/notices.sh.
[re_rav1d.clarify]
license = "BSD-2-Clause"

[[re_rav1d.clarify.files]]
path = "COPYING"
license = "BSD-2-Clause"
checksum = "6477f5c0674c89dc9251708a442343449bcb9c14b969b09286eb61d0640b284a"
