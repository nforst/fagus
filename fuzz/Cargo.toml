[package]
name = "fagus-fuzz"
description = "Fuzz targets for Fagus (cargo-fuzz, nightly only)"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own: the engine's workspace (and its stable toolchain) does not build this.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = { version = "1.5.0", features = ["derive"] }
# Without `parallel`: one thread writes the PDF, which keeps runs reproducible.
fagus = { path = "../crates/fagus", default-features = false }
fagus-css = { path = "../crates/fagus-css" }
# For the invariants target. It turns on `inspect` of fagus, for every target: features add up.
fagus-invariants = { path = "../crates/fagus-invariants" }
fagus-dom = { path = "../crates/fagus-dom" }
fagus-style = { path = "../crates/fagus-style" }
fagus-text = { path = "../crates/fagus-text" }
# For the worker target, which includes the protocol code of fagus-cli.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# For the worker target's memory report and trimming (fagus-cli's `memory.rs`).
[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
nix = { version = "0.31.4", default-features = false, features = ["resource"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[lints.rust]
unsafe_code = "deny"

# run.sh builds with `cargo fuzz run -O`, so these settings, not cargo-fuzz's flags, decide the
# checks: overflow checks and debug assertions for the engine and every dependency but one.
[profile.release]
debug = 1
panic = "unwind"
overflow-checks = true
debug-assertions = true

# The AV1 decoder overflows where its C original, dav1d, wraps an unsigned number (`read_golomb` in
# recon.rs), and it panics inside its `extern "C"` functions, which aborts instead of unwinding.
# Built as the release build of the engine builds it, without the checks, until rav1d wraps there
# itself.
[profile.release.package.re_rav1d]
overflow-checks = false
debug-assertions = false

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invariants"
path = "fuzz_targets/invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font"
path = "fuzz_targets/font.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "avif"
path = "fuzz_targets/avif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge"
path = "fuzz_targets/merge.rs"
test = false
