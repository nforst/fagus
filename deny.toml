[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable. Both come in through krilla, usvg and fontdb, which have not
    # moved to their successors (harfrust, skrifa) yet; Fagus shapes and reads fonts with those.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, needed by krilla and usvg" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, needed by krilla, usvg and fontdb" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    # jpeg-encoder, which carries parts of the Independent JPEG Group's library.
    "IJG",
]
confidence-threshold = 0.9
# The crates of this workspace are not published; their own licenses are in their Cargo.toml.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of the workspace depend on each other by path; none is published to crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
