[package]
name = "fagus-pdf"
description = "PDF output for Fagus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
fagus-dom.workspace = true
fagus-paint.workspace = true
fagus-text.workspace = true
krilla.workspace = true
krilla-svg.workspace = true
hayro-syntax.workspace = true
hayro-write.workspace = true
pdf-writer.workspace = true
skrifa.workspace = true
tiny-skia.workspace = true
png.workspace = true
zune-jpeg.workspace = true
image-webp.workspace = true
gif.workspace = true
tiff.workspace = true
re_rav1d.workspace = true
jpeg-encoder.workspace = true
usvg.workspace = true
resvg.workspace = true
# Switches krilla's compression to the faster zlib-rs backend, and measures the content streams
# of PDF images.
flate2.workspace = true
fagus-style.workspace = true
fagus-css.workspace = true
fagus-layout.workspace = true
rustc-hash.workspace = true
libm.workspace = true
# Compresses the object streams side by side; krilla compresses pages with it.
rayon = { workspace = true, optional = true }
thiserror.workspace = true
aes.workspace = true
cbc.workspace = true
sha2.workspace = true
sha1.workspace = true
getrandom.workspace = true
stringprep.workspace = true
unicode-normalization.workspace = true
cms.workspace = true
x509-cert.workspace = true
der.workspace = true
rsa.workspace = true
p256.workspace = true
p12-keystore.workspace = true

[features]
default = ["parallel"]
# Compresses page contents, images and object streams on a pool of threads, one per processor
# (`RAYON_NUM_THREADS` sets how many). Without it, a document is written on one thread.
parallel = ["dep:rayon", "krilla/rayon"]
